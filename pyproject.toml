[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscal-zero-trust-lens"
version = "0.1.0"
description = "LangGraph-powered agent that produces Zero Trust-aware views from OSCAL catalogs and SSPs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["oscal", "zero-trust", "nist", "langgraph", "security", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "langgraph==1.2.19",
    "langchain==1.4.8",
    "langchain-community==0.4.2",
    "langchain-openai==1.7.3",
    "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "black==26.10.1",
    "ruff==0.17.3",
]

[project.scripts]
oscal-zt = "oscal_zt.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/oscal-zero-trust-lens"
Repository = "https://github.com/yourusername/oscal-zero-trust-lens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
